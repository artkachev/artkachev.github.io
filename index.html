<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КАССА — звукорежиссёр и продюсер</title><meta name="description" content="КАССА — Артём Ткачев, звукорежиссёр и продюсер. Сведение, продакшн и сонграйтинг: Klava Koka, VERBEE, Асия, Ваня Дмитриенко, Mary Gu, Imanbek и другие."><link rel="canonical" href="https://artkachev.github.io/"><meta name="robots" content="index, follow"><meta property="og:type" content="website"><meta property="og:site_name" content="КАССА"><meta property="og:title" content="КАССА — звукорежиссёр и продюсер"><meta property="og:description" content="КАССА — Артём Ткачев, звукорежиссёр и продюсер. Сведение, продакшн и сонграйтинг: Klava Koka, VERBEE, Асия, Ваня Дмитриенко, Mary Gu, Imanbek и другие."><meta property="og:url" content="https://artkachev.github.io/"><meta property="og:image" content="https://artkachev.github.io/assets/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Golos%20Text:wght@400;500;700&subset=cyrillic,cyrillic-ext,latin,latin-ext&display=swap"><style>:root{--bg: #12100f;--accent: #e0a33c;--font-head: 'Oswald', 'Arial Narrow', system-ui, sans-serif;--font-body: 'Golos Text', system-ui, -apple-system, sans-serif;}
/* ── основа ─────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#f4f1ee;            /* основной текст */
  --ink-dim:#a8a19b;        /* второстепенный */
  --line:rgba(244,241,238,.13);
  --surface:rgba(244,241,238,.04);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --step:clamp(14px,1.6vw,20px);
  --maxw:1320px;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  font-feature-settings:"kern" 1;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;               /* место под панель плеера */
}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
html{scrollbar-color:var(--accent) var(--bg)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#3a3431;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
a{color:inherit}
img{max-width:100%;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pf{max-width:var(--maxw);margin:0 auto;padding:0 var(--step)}

/* ── шапка ──────────────────────────────────────────────────────── */
.pfnav{display:flex;align-items:baseline;justify-content:space-between;
  gap:20px;padding:34px 0 6px;flex-wrap:wrap}
.brand{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(34px,6.4vw,64px);line-height:.9;letter-spacing:.005em;margin:0}
.brand a{text-decoration:none}
/* логотип занимает место имени: высота как у набранного текста */
.lockup{display:inline-flex;align-items:center;gap:.42em}
.logomark{height:1.16em;width:auto;flex:none;color:var(--ink)}
/* встроенный svg красится темой; у него своя заливка на случай,
   если файл откроют отдельно */
.logomark path{fill:currentColor}
.tagline{color:var(--ink-dim);font-size:15px;letter-spacing:.01em;margin:10px 0 0}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0;padding:0;list-style:none;
  font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim)}
.facts b{color:var(--ink);font-weight:500}
.navlinks{display:flex;gap:18px;align-items:center;font-family:var(--font-head);
  font-weight:500;text-transform:uppercase;letter-spacing:.09em;font-size:13px}
.navlinks a{text-decoration:none;color:var(--ink-dim);padding:12px 2px;transition:color .18s}
.navlinks a:hover{color:var(--ink)}

/* ── фильтры ────────────────────────────────────────────────────── */
.filterbar{border-top:1px solid var(--line);margin:30px 0 22px;padding-top:6px}
.filters{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 22px;
  padding:2px 0}
.filters + .filters{border-top:1px solid var(--line);margin-top:2px}
.flabel{font-family:var(--font-head);font-weight:500;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;color:#6f6862;
  min-width:56px;flex:none}
.filters button{
  background:none;border:0;padding:11px 0;cursor:pointer;color:var(--ink-dim);
  font-family:var(--font-head);font-weight:500;font-size:14px;
  text-transform:uppercase;letter-spacing:.1em;min-height:44px;
  transition:color .18s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--accent)}
.fc{font-family:var(--font-body);font-size:11px;font-weight:500;
  letter-spacing:0;vertical-align:super;margin-left:5px;opacity:.65}

/* ── сетка работ ────────────────────────────────────────────────── */
.grid{display:grid;gap:clamp(10px,1.1vw,16px);
  grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));
  margin:0 0 70px;padding:0;list-style:none}
.tile{position:relative;display:block;width:100%;padding:0;border:0;cursor:pointer;
  background:var(--surface);border-radius:3px;overflow:hidden;text-align:left;
  aspect-ratio:1;color:var(--ink);isolation:isolate}
.tile img{width:100%;height:100%;object-fit:cover;
  transition:transform .5s cubic-bezier(.16,.84,.34,1),filter .35s}
.tile::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,7,6,.94) 0,rgba(8,7,6,.72) 26%,rgba(8,7,6,.06) 58%,transparent 100%)}
.tile:hover img,.tile:focus-visible img{transform:scale(1.045)}
.tmeta{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:14px 15px 15px}
.tartist{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:12px;letter-spacing:.08em;color:var(--accent);margin:0 0 3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttitle{font-size:15px;font-weight:500;line-height:1.25;margin:0;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbadge{position:absolute;top:11px;right:11px;z-index:1;
  font-family:var(--font-head);font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#fff;background:rgba(8,7,6,.66);
  backdrop-filter:blur(6px);padding:5px 8px;border-radius:2px}
/* кнопка плей: лежит соседом плитки и всплывает поверх неё */
.cell{position:relative}
.pbtn{position:absolute;left:50%;top:50%;z-index:3;
  transform:translate(-50%,-50%);width:62px;height:62px;border:0;padding:0;
  border-radius:50%;cursor:pointer;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.8);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
.pbtn[hidden]{display:none}
.pbtn:hover{filter:brightness(1.12)}
.pbtn .ico{width:26px;height:26px;fill:currentColor;display:block}
.pbtn .play{margin-left:3px}          /* треугольник кажется смещённым влево */
.pbtn .pause{display:none}
.pbtn.on .play{display:none}
.pbtn.on .pause{display:block}
@keyframes pop{
  from{opacity:0;transform:translate(-50%,-50%) scale(.82)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* выбранная, но ещё не запущенная плитка */
.tile.armed::before{content:"";position:absolute;inset:0;z-index:2;
  border:2px solid var(--accent);border-radius:3px;pointer-events:none}
.tile.armed img{filter:brightness(.55)}
.tile.playing img{filter:brightness(.72)}
.tile.playing .tartist{color:#fff}
.tile.playing::before{content:"";position:absolute;inset:0;z-index:2;
  border:2px solid var(--accent);border-radius:3px;pointer-events:none}
.tile.retap .tmeta::before{content:"нажми ещё раз";display:block;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  margin-bottom:5px;animation:retap 1.1s ease-in-out infinite}
@keyframes retap{0%,100%{opacity:.45}50%{opacity:1}}

/* ── панель плеера ──────────────────────────────────────────────── */
#player{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(10,9,8,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateY(105%);transition:transform .42s cubic-bezier(.16,.84,.34,1)}
#player.on{transform:none}
#player .inner{max-width:var(--maxw);margin:0 auto;padding:8px var(--step)}
#player iframe{width:100%;height:80px;border:0;display:block}

/* ── окно альбома ───────────────────────────────────────────────── */
#amodal{position:fixed;inset:0;z-index:60;display:none;
  background:rgba(6,5,5,.86);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;padding:var(--step)}
#amodal.on{display:flex}
#amodal .box{background:#191614;border:1px solid var(--line);border-radius:4px;
  width:min(560px,100%);max-height:82vh;overflow:auto;box-shadow:var(--shadow)}
#amodal header{display:flex;gap:14px;align-items:center;padding:18px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:#191614}
#amodal header img{width:64px;height:64px;border-radius:2px;flex:none}
#amodal h2{font-family:var(--font-head);text-transform:uppercase;font-weight:700;
  font-size:19px;line-height:1.1;margin:0}
#amodal .who{color:var(--accent);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;margin:0 0 4px;font-family:var(--font-head);font-weight:500}
#amodal ol{list-style:none;margin:0;padding:8px 0 12px}
#amodal li button{width:100%;background:none;border:0;color:var(--ink);cursor:pointer;
  text-align:left;padding:13px 18px;font:inherit;min-height:46px;
  display:flex;gap:12px;align-items:baseline;transition:background .16s}
#amodal li button:hover{background:var(--surface)}
#amodal li .n{color:var(--ink-dim);font-size:12px;min-width:20px}
#amodal .close{position:absolute;top:14px;right:16px;background:none;border:0;
  color:var(--ink-dim);font-size:26px;line-height:1;cursor:pointer;
  min-width:44px;min-height:44px}

/* ── страница трека ─────────────────────────────────────────────── */
.trk{display:grid;gap:38px;grid-template-columns:minmax(0,300px) minmax(0,1fr);
  align-items:start;margin:26px 0 60px}
.trk .cover{border-radius:3px;box-shadow:var(--shadow)}
.trk h1{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(27px,4.2vw,46px);line-height:1.02;margin:0 0 16px;letter-spacing:.004em}
.lead{font-size:17px;line-height:1.65;max-width:68ch;margin:0 0 20px;color:var(--ink)}
.trk p{max-width:68ch}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.roles li{font-family:var(--font-head);font-weight:500;text-transform:uppercase;
  font-size:12px;letter-spacing:.1em;border:1px solid var(--line);
  padding:8px 11px;border-radius:2px;color:var(--ink-dim)}
.roles li:first-child{color:var(--accent);border-color:var(--accent)}
.trk .embed{width:100%;height:152px;border:0;border-radius:12px;margin:6px 0 26px}
.back{display:inline-block;margin:0 0 6px;color:var(--ink-dim);text-decoration:none;
  font-family:var(--font-head);font-weight:500;text-transform:uppercase;
  letter-spacing:.09em;font-size:12px;padding:12px 0}
.back:hover{color:var(--accent)}

/* ── каталог работ ──────────────────────────────────────────────── */
.hub h1{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(28px,5vw,50px);line-height:1;margin:18px 0 18px}
.hub .lead{font-size:17px;line-height:1.65;max-width:74ch;margin:0 0 14px}
.hub .counter{font-family:var(--font-head);font-weight:500;font-size:12px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 22px}

/* указатель по буквам */
.alpha{display:flex;flex-wrap:wrap;gap:2px 4px;margin:0 0 44px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.alpha a{font-family:var(--font-head);font-weight:500;font-size:13px;
  letter-spacing:.06em;color:var(--ink-dim);text-decoration:none;
  min-width:34px;min-height:34px;display:inline-flex;align-items:center;
  justify-content:center;border-radius:2px;transition:color .16s,background .16s}
.alpha a:hover{color:var(--accent);background:var(--surface)}

/* буква-разделитель */
.hub .ltr{font-family:var(--font-head);font-weight:700;font-size:clamp(40px,7vw,74px);
  line-height:1;color:var(--line);margin:46px 0 14px;scroll-margin-top:18px;
  border-bottom:1px solid var(--line);padding-bottom:10px}

/* артист */
.art{margin:0 0 30px;scroll-margin-top:18px}
.art h3{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:16px;letter-spacing:.08em;color:var(--accent);margin:0 0 8px;
  display:flex;align-items:baseline;gap:9px}
.art .cnt{font-family:var(--font-body);font-weight:500;font-size:11px;
  letter-spacing:0;color:var(--ink-dim)}
.hub ul{list-style:none;margin:0;padding:0;
  display:grid;gap:0 26px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.hub li a{display:block;padding:9px 0;text-decoration:none;color:var(--ink);
  font-size:15px;transition:color .16s}
.hub li a:hover{color:var(--accent)}
.hub .yr{color:var(--ink-dim);font-size:13px;margin-left:7px}
.hub .with{color:var(--ink-dim);font-size:13px}

/* альбом внутри артиста */
.alb{margin:0 0 14px;border-left:2px solid var(--line);padding-left:15px}
.albhead{margin:0 0 2px;font-size:15px;font-weight:500;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.albtag{font-family:var(--font-head);font-weight:500;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.subhead{font-family:var(--font-head);font-weight:500;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 0}

/* ── вопросы и ответы ───────────────────────────────────────────── */
.faq h1{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(26px,4.4vw,46px);line-height:1.04;margin:18px 0 18px;max-width:20ch}
.faq .lead{font-size:17px;line-height:1.65;max-width:70ch;margin:0 0 24px}
.tldr{border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:2px;padding:18px 20px;margin:0 0 30px;max-width:78ch;
  background:var(--surface)}
.tldr p:last-child{margin:0;font-size:16px;line-height:1.7}
.tldr .subhead{margin:0 0 8px}
.num{color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}

.faqtabs{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 34px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.faqtabs a{font-family:var(--font-head);font-weight:500;font-size:13px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--ink-dim);
  text-decoration:none;padding:11px 0;min-height:44px;display:inline-flex;
  align-items:center;transition:color .16s}
.faqtabs a:hover{color:var(--accent)}

.faqsec{margin:0 0 34px;scroll-margin-top:18px}
.faqsec h2{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:15px;letter-spacing:.09em;color:var(--accent);margin:0 0 4px;
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);scroll-margin-top:18px}
.faq summary{cursor:pointer;padding:16px 34px 16px 0;position:relative;
  font-size:16px;line-height:1.45;list-style:none;transition:color .16s}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--accent)}
.faq summary::after{content:"+";position:absolute;right:6px;top:50%;
  transform:translateY(-50%);color:var(--ink-dim);font-size:20px;line-height:1}
.faq details[open] summary{color:var(--accent)}
.faq details[open] summary::after{content:"–";color:var(--accent)}
.faq .ans{padding:0 0 20px;max-width:74ch;color:var(--ink-dim);
  font-size:16px;line-height:1.72}
.faq .ans a{color:var(--ink);text-decoration:underline;
  text-decoration-color:var(--line);text-underline-offset:3px}
.faq .ans a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.faq .upd{color:var(--ink-dim);font-size:13px;margin:26px 0 40px}

/* ── подвал ─────────────────────────────────────────────────────── */
.foot{border-top:1px solid var(--line);padding:38px 0 46px;margin-top:20px}
.foot h2{font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(22px,3.4vw,34px);line-height:1.05;margin:0 0 18px}
.cts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px;padding:0;list-style:none}
.cts a{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;
  text-decoration:none;border:1px solid var(--line);border-radius:2px;
  font-family:var(--font-head);font-weight:500;text-transform:uppercase;
  letter-spacing:.09em;font-size:13px;transition:border-color .18s,color .18s}
.cts a:hover{border-color:var(--accent);color:var(--accent)}
.cts a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cts a.primary:hover{filter:brightness(1.1);color:#fff}
.foot .small{color:var(--ink-dim);font-size:13px;margin:0}
.foot .small a{color:var(--ink-dim)}

/* ── адаптив ────────────────────────────────────────────────────── */
@media (max-width:760px){
  .trk{grid-template-columns:1fr;gap:24px}
  .trk .cover{max-width:290px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(158px,47%),1fr))}
  .pbtn{width:54px;height:54px}
  .pbtn .ico{width:23px;height:23px}
  .filters{gap:2px 16px}
  #player iframe{height:80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important}
}

дам тебя никому - Вonus track"}]}, {"artist": "PUSSYKILLER", "title": "Плохой пример", "cover": "baf86c5661354a44bb14e3ef", "tracks": [{"id": "2kIxDpQlngRVYUAT45vOil", "title": "Не выноси"}, {"id": "6uNTSxQZsJxMW6dn9UUN5G", "title": "На пьяную голову"}, {"id": "3EvyeCMdWERZWN8i3TQgfd", "title": "Время"}]}, {"artist": "Асия", "title": "ударение на А", "cover": "824f9bf8719b7698d158d592", "tracks": [{"id": "4NHekgdl6eicmzg0CJOkor", "title": "Я не злюсь, милый"}, {"id": "4tifsl9u8ZxYFf4LEzNfRQ", "title": "Молчу"}, {"id": "71cVD3Zs8lj8iZizQ6zWLR", "title": "Как ты"}, {"id": "1maFgPX4y16tGKKr9b11b5", "title": "Второй том (Bonus Track)"}]}, {"artist": "Марфа", "title": "Танцуй с моей тенью", "cover": "ddfe2584de4a09e14441d020", "tracks": [{"id": "4po3ub9fmp85MP6LNHQDYh", "title": "Танцуй с моей тенью"}, {"id": "6lBXXgbs2aU83MRkHaxPpF", "title": "Темнота"}, {"id": "2FgGTDNYW10lWuOrLVBKJB", "title": "Есть на свете человек"}, {"id": "3Twq6zbBOFIbs6ePrCOSUz", "title": "Ты со мной"}]}, {"artist": "VERBEE", "title": "Простой. Часть 2", "cover": "740da9c5587c7ddd1d343e44", "tracks": [{"id": "3aNbBcLOS50mEpxPYemK4g", "title": "Расклад"}, {"id": "7DkAui4Fah1RpcR1sOo7ah", "title": "Истерика"}, {"id": "3QBcqjya0wgIF2HCcKyqf8", "title": "Ярче"}, {"id": "30f2EMEngxYVKtdCjw7OlY", "title": "Просто болит"}]}];</script><script src="https://open.spotify.com/embed/iframe-api/v1" async></script><script>/* Фильтры, плеер Spotify и окно альбома. Без библиотек.

   Плитка сингла работает в два шага: нажатие на обложку только выбирает
   трек и зажигает кнопку плей, а звук запускает уже она. Так ничего не
   начинает играть само от случайного касания. */
(function () {
  "use strict";

  var ctrl = null;          // контроллер Spotify iFrame API
  var current = null;       // плитка, загруженная в плеер
  var armed = null;         // плитка, выбранная но ещё не запущенная
  var isPaused = true;
  var wantPlay = false;     // сафари на айфоне глушит автостарт
  var pendingUri = null;

  var grid = document.querySelector(".grid");
  var panel = document.getElementById("player");

  /* ── фильтры: жанр и роль, работают вместе ───────────────── */
  var bar = document.querySelector(".filterbar");
  var picked = { g: "ALL", r: "ALL" };

  function applyFilters() {
    document.querySelectorAll(".grid > li").forEach(function (li) {
      var tile = li.querySelector(".tile");
      if (!tile) return;
      var okGenre = picked.g === "ALL" || tile.dataset.g === picked.g;
      var roles = (tile.dataset.r || "").split(" ");
      var okRole = picked.r === "ALL" || roles.indexOf(picked.r) !== -1;
      li.hidden = !(okGenre && okRole);
    });
  }

  if (bar) {
    bar.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-f]");
      if (!btn) return;
      var row = btn.closest(".filters");
      picked[row.dataset.dim] = btn.dataset.f;
      row.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      applyFilters();
    });
  }

  /* ── состояние плиток ────────────────────────────────────── */
  function playBtn(tile) {
    return tile.parentElement.querySelector(".pbtn");
  }

  function refresh() {
    if (!grid) return;
    grid.querySelectorAll(".tile[data-id]").forEach(function (tile) {
      var btn = playBtn(tile);
      if (!btn) return;
      var isCurrent = tile === current;
      var show = tile === armed || isCurrent;
      btn.hidden = !show;
      var playing = isCurrent && !isPaused;
      btn.classList.toggle("on", playing);
      tile.classList.toggle("armed", tile === armed && !isCurrent);
      tile.classList.toggle("playing", isCurrent);
      var word = playing ? grid.dataset.pause : grid.dataset.listen;
      btn.setAttribute("aria-label", word + ": " + btn.dataset.label);
    });
  }

  function arm(tile) {
    armed = tile;
    refresh();
    var btn = playBtn(tile);
    if (btn) btn.focus();
  }

  function disarm() {
    if (!armed) return;
    armed = null;
    refresh();
  }

  /* ── плеер ───────────────────────────────────────────────── */
  window.onSpotifyIframeApiReady = function (IFrameAPI) {
    var el = document.getElementById("pframe");
    IFrameAPI.createController(el, { width: "100%", height: 80 }, function (c) {
      ctrl = c;
      c.addListener("playback_update", function (ev) {
        if (!current) return;
        isPaused = !!(ev && ev.data && ev.data.isPaused);
        if (wantPlay && isPaused) {
          try { c.resume(); } catch (err) { current.classList.add("retap"); }
        } else if (!isPaused) {
          wantPlay = false;
          current.classList.remove("retap");
        }
        refresh();
      });
      if (pendingUri) { start(pendingUri); pendingUri = null; }
    });
  };

  function start(uri) {
    ctrl.loadUri(uri);
    ctrl.play();
  }

  /* Запускает трек плитки. Повторный вызов на той же плитке — пауза. */
  window.play = function (tile) {
    var id = tile.dataset.id;
    if (!id) return;
    if (current === tile && ctrl) { ctrl.togglePlay(); return; }
    if (current && current !== tile) current.classList.remove("playing", "retap");
    current = tile;
    armed = null;
    isPaused = false;
    wantPlay = true;
    panel.classList.add("on");
    refresh();
    var uri = "spotify:track:" + id;
    if (ctrl) { start(uri); } else { pendingUri = uri; }
  };

  /* ── клики по сетке ──────────────────────────────────────── */
  if (grid) {
    grid.addEventListener("click", function (e) {
      var btn = e.target.closest(".pbtn");
      if (btn) {                       // второй шаг: играем
        window.play(btn.parentElement.querySelector(".tile"));
        return;
      }
      var tile = e.target.closest(".tile");
      if (!tile) return;
      if (tile.dataset.album !== undefined) {
        window.openAlbum(Number(tile.dataset.album));
      } else if (tile === current) {   // играющую плитку не сбрасываем
        window.play(tile);
      } else {                         // первый шаг: только выбираем
        arm(tile);
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") disarm();
    });
  }

  /* ── окно альбома ────────────────────────────────────────── */
  var modal = document.getElementById("amodal");
  var openerTile = null;

  window.openAlbum = function (i) {
    var al = (window.ALBUMS || [])[i];
    if (!al) return;
    openerTile = document.activeElement;
    document.getElementById("awho").textContent = al.artist;
    document.getElementById("atitle").textContent = al.title;
    var cover = document.getElementById("acover");
    cover.src = "/covers/" + al.cover + ".jpg";
    cover.alt = al.artist + " — " + al.title;
    var list = document.getElementById("alist");
    list.textContent = "";
    al.tracks.forEach(function (t, n) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.id = t.id;
      var num = document.createElement("span");
      num.className = "n";
      num.textContent = String(n + 1);
      var name = document.createElement("span");
      name.textContent = t.title;
      b.append(num, name);
      b.addEventListener("click", function () { window.play(b); });
      li.appendChild(b);
      list.appendChild(li);
    });
    modal.classList.add("on");
    modal.querySelector(".close").focus();
  };

  function closeAlbum() {
    modal.classList.remove("on");
    if (openerTile && openerTile.focus) openerTile.focus();
  }

  if (modal) {
    modal.addEventListener("click", function (e) {
      if (e.target === modal || e.target.closest(".close")) closeAlbum();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && modal.classList.contains("on")) closeAlbum();
    });
  }
})();
